<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Cobra Faminta 2.0</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #171e2e;
    --grid: #1b2335;
    --text: #e8ecf4;
    --muted: #8a94a8;
    --snake: #4ade80;
    --snake-head: #22c55e;
    --apple: #f87171;
    --gold: #facc15;
    --slow: #60a5fa;
    --ghost: #c084fc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    user-select: none;
  }
  h1 { margin: 8px 0 4px; font-size: 1.6rem; letter-spacing: .5px; }
  h1 span { color: var(--snake); }
  .hud {
    width: min(480px, 100%);
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 8px 0;
    font-variant-numeric: tabular-nums;
  }
  .hud .label { color: var(--muted); font-size: .8rem; display: block; }
  .hud .value { font-size: 1.3rem; font-weight: 700; }
  .effects { display: flex; gap: 6px; min-height: 28px; }
  .chip {
    font-size: .75rem; font-weight: 600;
    padding: 4px 8px; border-radius: 999px;
    background: var(--panel); border: 1px solid currentColor;
  }
  .wrap { position: relative; width: min(480px, 100%); }
  canvas {
    display: block; width: 100%; aspect-ratio: 1;
    background: var(--panel);
    border-radius: 12px;
    touch-action: none;
  }
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px; text-align: center;
    background: rgba(15, 20, 32, .82);
    border-radius: 12px; padding: 16px;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { margin: 0; font-size: 1.8rem; }
  .overlay p { margin: 0; color: var(--muted); }
  button {
    font: inherit; font-weight: 700;
    background: var(--snake); color: #062b14;
    border: 0; border-radius: 10px;
    padding: 10px 22px; cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  .legend {
    width: min(480px, 100%);
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 6px 16px; margin-top: 14px;
    font-size: .85rem; color: var(--muted);
  }
  .legend b { color: var(--text); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .keys { margin-top: 10px; font-size: .8rem; color: var(--muted); text-align: center; }
</style>
</head>
<body>
  <h1>🐍 Cobra <span>Faminta</span> 2.0</h1>

  <div class="hud">
    <div><span class="label">Pontos</span><span class="value" id="score">0</span></div>
    <div class="effects" id="effects"></div>
    <div style="text-align:right"><span class="label">Recorde</span><span class="value" id="best">0</span></div>
  </div>

  <div class="wrap">
    <canvas id="game" width="480" height="480"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">Pronto?</h2>
      <p id="ovText">Coma frutas, cresça, não bata em nada.</p>
      <button id="startBtn">Jogar</button>
    </div>
  </div>

  <div class="legend">
    <div><span class="dot" style="background:var(--apple)"></span><b>Maçã</b>: +1 ponto</div>
    <div><span class="dot" style="background:var(--gold)"></span><b>Dourada</b>: pontos em dobro</div>
    <div><span class="dot" style="background:var(--slow)"></span><b>Gelo</b>: tempo mais lento</div>
    <div><span class="dot" style="background:var(--ghost)"></span><b>Fantasma</b>: atravessa paredes</div>
  </div>
  <div class="keys">Setas ou WASD para mover · Espaço para pausar · M liga/desliga o som · No celular, deslize o dedo</div>

<script>
(() => {
  const COLS = 20, ROWS = 20;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const CELL = canvas.width / COLS;

  const $score = document.getElementById('score');
  const $best = document.getElementById('best');
  const $effects = document.getElementById('effects');
  const $overlay = document.getElementById('overlay');
  const $ovTitle = document.getElementById('ovTitle');
  const $ovText = document.getElementById('ovText');
  const $startBtn = document.getElementById('startBtn');

  const POWERS = {
    gold:  { color: '#facc15', name: '2× pontos', duration: 8000 },
    slow:  { color: '#60a5fa', name: 'Lento',     duration: 6000 },
    ghost: { color: '#c084fc', name: 'Fantasma',  duration: 7000 },
  };
  const POWER_LIFETIME = 7000; // tempo que uma fruta especial fica no mapa

  let best = 0;
  try { best = parseInt(localStorage.getItem('cobra-best') || '0', 10) || 0; } catch (e) {}
  $best.textContent = best;

  let snake, dir, dirQueue, apple, special, score, effects, state, lastTime, acc, particles;

  // ---------- som ----------
  let audio = null, muted = false;
  try { muted = localStorage.getItem('cobra-mute') === '1'; } catch (e) {}

  function beep(freqs, dur = 0.08, type = 'square', vol = 0.06) {
    if (muted) return;
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const t = audio.currentTime + i * dur;
      const osc = audio.createOscillator(), gain = audio.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(f, t);
      gain.gain.setValueAtTime(vol, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(gain).connect(audio.destination);
      osc.start(t); osc.stop(t + dur);
    });
  }
  const sfx = {
    eat:   () => beep([660, 880], 0.06),
    power: () => beep([523, 659, 784, 1047], 0.07, 'triangle', 0.08),
    over:  () => beep([392, 330, 262, 196], 0.14, 'sawtooth', 0.05),
  };

  function reset() {
    snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
    dir = { x: 1, y: 0 };
    dirQueue = [];
    score = 0;
    effects = {};          // tipo -> timestamp de expiração
    special = null;        // { x, y, type, expires }
    particles = [];
    acc = 0;
    apple = freeCell();
    updateHud();
  }

  function freeCell() {
    const taken = new Set(snake.map(s => s.x + ',' + s.y));
    if (apple) taken.add(apple.x + ',' + apple.y);
    if (special) taken.add(special.x + ',' + special.y);
    const free = [];
    for (let x = 0; x < COLS; x++)
      for (let y = 0; y < ROWS; y++)
        if (!taken.has(x + ',' + y)) free.push({ x, y });
    return free[Math.floor(Math.random() * free.length)];
  }

  function tickInterval() {
    // começa em 140ms e acelera até 60ms conforme a pontuação
    let ms = Math.max(60, 140 - score * 2.5);
    if (isActive('slow')) ms *= 1.7;
    return ms;
  }

  function isActive(type) { return effects[type] && effects[type] > performance.now(); }

  function step() {
    if (dirQueue.length) dir = dirQueue.shift();

    let head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    const outside = head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS;
    if (outside) {
      if (isActive('ghost')) {
        head.x = (head.x + COLS) % COLS;
        head.y = (head.y + ROWS) % ROWS;
      } else return gameOver();
    }

    const willEat = head.x === apple.x && head.y === apple.y;
    // a cauda sai do lugar neste passo, então pode ser ocupada (exceto se vamos crescer)
    const body = willEat ? snake : snake.slice(0, -1);
    if (body.some(s => s.x === head.x && s.y === head.y)) return gameOver();

    snake.unshift(head);

    if (willEat) {
      addPoints(1);
      sfx.eat();
      burst(head, '#f87171');
      apple = freeCell();
      if (!special && Math.random() < 0.3) spawnSpecial();
    } else {
      snake.pop();
    }

    if (special && head.x === special.x && head.y === special.y) {
      const p = POWERS[special.type];
      effects[special.type] = performance.now() + p.duration;
      addPoints(2);
      sfx.power();
      burst(head, p.color, 24);
      special = null;
    }
  }

  function spawnSpecial() {
    const types = Object.keys(POWERS);
    const cell = freeCell();
    if (!cell) return;
    special = { ...cell, type: types[Math.floor(Math.random() * types.length)], expires: performance.now() + POWER_LIFETIME };
  }

  function addPoints(n) {
    score += isActive('gold') ? n * 2 : n;
    updateHud();
  }

  function updateHud() {
    $score.textContent = score;
    if (score > best) {
      best = score;
      $best.textContent = best;
      try { localStorage.setItem('cobra-best', best); } catch (e) {}
    }
  }

  function renderEffects(now) {
    const html = Object.keys(POWERS)
      .filter(t => effects[t] > now)
      .map(t => `<span class="chip" style="color:${POWERS[t].color}">${POWERS[t].name} ${Math.ceil((effects[t] - now) / 1000)}s</span>`)
      .join('');
    if ($effects.innerHTML !== html) $effects.innerHTML = html;
  }

  function burst(cell, color, n = 12) {
    const cx = (cell.x + .5) * CELL, cy = (cell.y + .5) * CELL;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = 1 + Math.random() * 3;
      particles.push({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, color });
    }
  }

  // ---------- desenho ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawFruit(c, color, now, pulse) {
    const s = pulse ? 1 + Math.sin(now / 120) * 0.12 : 1;
    const cx = (c.x + .5) * CELL, cy = (c.y + .5) * CELL;
    ctx.save();
    ctx.shadowColor = color; ctx.shadowBlur = pulse ? 18 : 8;
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(cx, cy, CELL * .36 * s, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.beginPath(); ctx.arc(cx - CELL * .1, cy - CELL * .12, CELL * .08, 0, Math.PI * 2); ctx.fill();
  }

  function draw(now) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // grade quadriculada
    ctx.fillStyle = '#1b2335';
    for (let x = 0; x < COLS; x++)
      for (let y = 0; y < ROWS; y++)
        if ((x + y) % 2) ctx.fillRect(x * CELL, y * CELL, CELL, CELL);

    // borda brilha quando o fantasma está ativo
    if (isActive('ghost')) {
      ctx.strokeStyle = 'rgba(192,132,252,' + (0.4 + Math.sin(now / 150) * 0.3) + ')';
      ctx.lineWidth = 4;
      ctx.strokeRect(2, 2, canvas.width - 4, canvas.height - 4);
    }

    drawFruit(apple, '#f87171', now, false);
    if (special) {
      const left = special.expires - now;
      // pisca nos últimos 2 segundos
      if (left > 2000 || Math.floor(now / 150) % 2) drawFruit(special, POWERS[special.type].color, now, true);
    }

    // cobra
    const ghost = isActive('ghost');
    const gold = isActive('gold');
    snake.forEach((s, i) => {
      const t = i / snake.length;
      const pad = i === 0 ? 1 : 2 + t * 3;
      // arco-íris: cada segmento tem um matiz diferente, que desliza com o tempo
      const hue = (i * 45 - now / 10) % 360;
      let color = `hsl(${hue < 0 ? hue + 360 : hue}, 90%, ${i === 0 ? 60 : 58 - t * 10}%)`;
      if (gold) color = i === 0 ? '#eab308' : `hsl(${48 - t * 10}, 90%, ${60 - t * 15}%)`;
      ctx.globalAlpha = ghost ? 0.55 : 1;
      ctx.fillStyle = color;
      roundRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 6);
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    // olhos
    const h = snake[0];
    const hx = (h.x + .5) * CELL, hy = (h.y + .5) * CELL;
    const px = -dir.y, py = dir.x; // perpendicular
    ctx.fillStyle = '#0f1420';
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(hx + dir.x * 4 + px * side * 5, hy + dir.y * 4 + py * side * 5, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // partículas
    particles.forEach(p => {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    });
    ctx.globalAlpha = 1;
  }

  // ---------- loop ----------
  function loop(now) {
    if (lastTime == null) lastTime = now;
    const dt = Math.min(now - lastTime, 250);
    lastTime = now;

    if (state === 'playing') {
      acc += dt;
      while (acc >= tickInterval() && state === 'playing') {
        acc -= tickInterval();
        step();
      }
      if (special && now > special.expires) special = null;
    }

    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vx *= .94; p.vy *= .94; p.life -= .03; });
    particles = particles.filter(p => p.life > 0);

    renderEffects(now);
    draw(now);
    requestAnimationFrame(loop);
  }

  // ---------- estados ----------
  function start() {
    reset();
    state = 'playing';
    $overlay.classList.add('hidden');
  }

  function gameOver() {
    state = 'over';
    sfx.over();
    burst(snake[0], '#ffffff', 30);
    $ovTitle.textContent = 'Fim de jogo!';
    $ovText.textContent = `Você fez ${score} ponto${score === 1 ? '' : 's'}. Recorde: ${best}.`;
    $startBtn.textContent = 'Jogar de novo';
    $overlay.classList.remove('hidden');
  }

  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      $ovTitle.textContent = 'Pausado';
      $ovText.textContent = 'Aperte Espaço para continuar.';
      $startBtn.textContent = 'Continuar';
      $overlay.classList.remove('hidden');
    } else if (state === 'paused') {
      state = 'playing';
      $overlay.classList.add('hidden');
    }
  }

  // ---------- controles ----------
  function turn(nx, ny) {
    const last = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
    if (last.x === -nx && last.y === -ny) return;   // sem meia-volta
    if (last.x === nx && last.y === ny) return;
    if (dirQueue.length < 3) dirQueue.push({ x: nx, y: ny });
  }

  const KEYS = {
    ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
    ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
    ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
    ArrowRight: [1, 0], d: [1, 0], D: [1, 0],
  };

  document.addEventListener('keydown', e => {
    if (e.key === 'm' || e.key === 'M') {
      muted = !muted;
      try { localStorage.setItem('cobra-mute', muted ? '1' : '0'); } catch (err) {}
      if (!muted) sfx.eat();
      return;
    }
    if (e.key === ' ') {
      e.preventDefault();
      if (state === 'playing' || state === 'paused') togglePause();
      else start();
      return;
    }
    if (e.key === 'Enter' && state !== 'playing' && state !== 'paused') return start();
    const k = KEYS[e.key];
    if (k && state === 'playing') { e.preventDefault(); turn(k[0], k[1]); }
  });

  $startBtn.addEventListener('click', () => {
    if (state === 'paused') togglePause(); else start();
  });

  let touchStart = null;
  canvas.addEventListener('touchstart', e => {
    const t = e.touches[0]; touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  canvas.addEventListener('touchmove', e => {
    if (!touchStart || state !== 'playing') return;
    const t = e.touches[0];
    const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx), 0); else turn(0, Math.sign(dy));
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });

  reset();
  state = 'ready';
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
